# Secure MQTT listener
listener 8883 0.0.0.0
protocol mqtt

# TLS configuration
certfile /mosquitto/certs/broker.crt
keyfile /mosquitto/certs/broker.key

# Minimum supported TLS version
tls_version tlsv1.2

# Standard TLS for this implementation phase
require_certificate false
allow_anonymous true

# Persistence
persistence false

# Logging
log_dest stdout
log_type all
connection_messages true